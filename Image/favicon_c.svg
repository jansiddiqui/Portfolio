<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background -->
  <rect width="512" height="512" rx="80" fill="#0d1b2e"/>
  <!-- Left angle bracket < -->
  <text x="52" y="330" text-anchor="start"
    font-family="'Arial Black', 'Courier New', monospace"
    font-size="200" font-weight="900" fill="#38bdf8" opacity="0.55">&lt;</text>
  <!-- Bold J in center -->
  <text x="256" y="340" text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="260" font-weight="900" fill="#38bdf8">J</text>
  <!-- Right angle bracket > -->
  <text x="460" y="330" text-anchor="end"
    font-family="'Arial Black', 'Courier New', monospace"
    font-size="200" font-weight="900" fill="#38bdf8" opacity="0.55">&gt;</text>
</svg>
