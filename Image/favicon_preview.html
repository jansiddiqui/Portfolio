<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>White Background Founder Favicon Preview — Jan Mohammad</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
    }
    .preview-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .scales {
      display: flex;
      align-items: flex-end;
      gap: 2rem;
    }
    .scale-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .scale-label {
      font-size: 0.75rem;
      font-family: monospace;
      color: #64748b;
    }
    .browser-tab-mock {
      background: #1e293b;
      border-radius: 10px 10px 0 0;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #38bdf8;
    }
    .tab-title {
      font-size: 0.8rem;
      color: #e2e8f0;
      font-weight: 500;
    }
    .light-tab-mock {
      background: #f1f5f9;
      border-radius: 10px 10px 0 0;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #0284c7;
    }
    .light-tab-title {
      font-size: 0.8rem;
      color: #0f172a;
      font-weight: 600;
    }
    .mock-row {
      display: flex;
      gap: 1.5rem;
    }
  </style>
</head>
<body>
  <h1>White Background Founder Favicon</h1>
  <p>Crisp Off-White Container • High Contrast Navy &amp; Cyan Monogram • Perfect Visibility on Dark &amp; Light Tabs</p>

  <div class="preview-card">
    <div class="mock-row">
      <div class="browser-tab-mock">
        <img src="favicon.svg" width="16" height="16" alt="Dark Mode Tab Icon">
        <span class="tab-title">Jan Mohammad - Dark Tab</span>
      </div>
      <div class="light-tab-mock">
        <img src="favicon.svg" width="16" height="16" alt="Light Mode Tab Icon">
        <span class="light-tab-title">Jan Mohammad - Light Tab</span>
      </div>
    </div>

    <div class="scales">
      <div class="scale-box">
        <img src="favicon.svg" width="128" height="128" alt="128px App Scale">
        <span class="scale-label">128px (App Icon)</span>
      </div>
      <div class="scale-box">
        <img src="favicon.svg" width="48" height="48" alt="48px Google Search Result">
        <span class="scale-label">48px (Google Search Icon)</span>
      </div>
      <div class="scale-box">
        <img src="favicon.svg" width="32" height="32" alt="32px Retina Tab">
        <span class="scale-label">32px (Retina Tab)</span>
      </div>
      <div class="scale-box">
        <img src="favicon.svg" width="16" height="16" alt="16px Browser Tab">
        <span class="scale-label">16px (Browser Tab)</span>
      </div>
    </div>
  </div>
</body>
</html>
